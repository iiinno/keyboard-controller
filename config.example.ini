; Copy this file to config.ini, then replace the two required match values
; with IDs from tools\list-devices.ahk.

[general]
; AUTO blocks the built-in keyboard only while the configured external keyboard is
; present. FORCED_ON always keeps the built-in keyboard usable.
start_mode=AUTO

; AutoHotkey hotkey syntax. Optional if you launch tools\toggle.ahk from a device app.
toggle_hotkey=^!+F12

[internal_keyboard]
; REQUIRED. One or more case-insensitive substrings from the built-in keyboard's
; Interception hardware ID. Exactly one keyboard must match.
match=REPLACE_WITH_INTERNAL_KEYBOARD_ID

; Optional safety net. A candidate containing any of these substrings is never treated
; as the built-in keyboard. External keyboard VID/PID digits are useful here.
exclude=

[external_keyboard]
; REQUIRED. One or more case-insensitive substrings from a currently present HID
; device instance ID for the external keyboard.
match=REPLACE_WITH_EXTERNAL_HID_ID

[timing]
poll_ms=1000
settle_ms=3000
drain_ms=10
resume_gap_factor=3

[logging]
max_kb=256