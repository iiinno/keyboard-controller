name: Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  unix:
    uses: ./.github/workflows/portable.yml
  windows:
    uses: ./.github/workflows/test.yml
  publish:
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Use a semantic version tag'; exit 1; }
          gh run download "$GITHUB_RUN_ID" --pattern 'package-*' --dir release-assets
          mapfile -d '' packages < <(find release-assets -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name '*.zip' -o -name '*.zip.sha256' \) -print0)
          [[ ${#packages[@]} == 10 ]] || { echo 'Expected five packages and five checksum files'; exit 1; }
          gh release create "$GITHUB_REF_NAME" "${packages[@]}" --verify-tag --generate-notes
